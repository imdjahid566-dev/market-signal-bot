<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAHID HACK PRO</title>
<style>
body{margin:0;background:#050816;color:white;font-family:sans-serif;text-align:center}
.top{background:linear-gradient(90deg,#00ff88,#00ccff);color:black;padding:14px;font-size:22px;font-weight:900}
.box{margin:15px;border:2px solid #00ff88;border-radius:18px;padding:15px;background:#0a1030;position:relative;overflow:hidden}
#ball{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#80ffaa,#00cc44 60%,#006622);box-shadow:0 0 30px #00ff66;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;position:absolute;left:10px;top:60px;z-index:10;touch-action:none;cursor:grab}
canvas{width:100%;height:180px}
button{padding:12px 18px;border-radius:20px;border:none;background:#1a2340;color:white;margin:5px;font-weight:bold}
button.active{background:#00ff88;color:black}
.analyze{background:#00ff88;color:black;padding:15px 30px;border-radius:12px;font-size:18px;font-weight:900;margin:15px;border:none}
.signal{font-size:55px;font-weight:900;color:#00ff66}
</style>
</head>
<body>
<div class="top">🤖 JAHID HACK PRO • LIVE</div>
<p>Market: LIVE • BTC $<span id="btc">79009</span> • <span id="clock"></span></p>
<p style="color:#00ff88">👆 বলটাকে আঙুল দিয়ে টেনে উপরে-নিচে নাড়াও!</p>

<div class="box">
<div id="ball">🤖<br>JAHID<br>HACK PRO<br>● BUY</div>
<canvas id="chart"></canvas>
</div>

<button class="pair active" onclick="setPair(this,'GBP/NZD')">GBP/NZD</button>
<button class="pair" onclick="setPair(this,'EUR/USD')">EUR/USD</button>
<button class="pair" onclick="setPair(this,'USD/JPY')">USD/JPY</button>
<button class="pair" onclick="setPair(this,'BTC/USD')">BTC/USD</button>

<div style="background:#121a3d;margin:15px;border-radius:18px;padding:20px">
<div id="pname">USD/JPY Analysis</div>
<div style="display:flex;align-items:center;justify-content:center;gap:10px"><div style="width:80px;height:80px;background:#6bbf3a;border-radius:50%"></div><div id="sig" class="signal">UP</div></div>
<div id="msg">Buyers strong! Support থেকে bounce আসবে।</div>
<div>Time: <span id="time"></span></div>
</div>
<button class="analyze" onclick="analyze()">🔄 ANALYZE NOW</button>
<p style="color:#666;font-size:12px">Demo only. Not financial advice.</p>

<script>
let cur='USD/JPY';
function setPair(btn,p){document.querySelectorAll('.pair').forEach(b=>b.classList.remove('active'));btn.classList.add('active');cur=p;analyze();}
function analyze(){
 let up=Math.random()>0.4;
 document.getElementById('pname').innerText=cur+' Analysis';
 document.getElementById('sig').innerText=up?'UP':'DOWN';
 document.getElementById('sig').style.color=up?'#00ff66':'#ff4444';
 document.getElementById('msg').innerText=up?'Buyers strong! Support থেকে bounce আসবে।':'Sellers strong! Resistance থেকে down আসবে।';
 document.getElementById('btc').innerText=Math.floor(79000+Math.random()*1000);
 draw(up);
}
function draw(up){
 let c=document.getElementById('chart');let x=c.getContext('2d');c.width=c.offsetWidth;c.height=180;
 x.clearRect(0,0,c.width,c.height);
 for(let i=0;i<30;i++){let cx=5+i*11;let h=30+Math.random()*50;let cy=50+Math.random()*60;x.fillStyle=Math.random()>0.5?'#00cc66':'#ff4444';x.fillRect(cx,cy,8,h);x.fillRect(cx+3,cy-12,2,h+24);}
 x.strokeStyle='#00ff88';x.lineWidth=2;x.beginPath();x.moveTo(0,90);x.lineTo(c.width,90);x.stroke();
}
setInterval(()=>{let d=new Date();document.getElementById('clock').innerText=d.toLocaleTimeString();document.getElementById('time').innerText=d.toLocaleTimeString();},1000);
// Ball Drag
let ball=document.getElementById('ball'),drag=false,oy=0;
ball.addEventListener('touchstart',e=>{drag=true;oy=e.touches[0].clientY-ball.offsetTop;});
ball.addEventListener('touchmove',e=>{if(!drag)return;let y=e.touches[0].clientY-oy;ball.style.top=Math.max(10,Math.min(180,y))+'px';});
ball.addEventListener('touchend',()=>drag=false);
analyze();
</script>
</body>
</html>
